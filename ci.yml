build:
  name: Build
  runs-on: ubuntu-latest

  needs:
    - lint
    - sonarqube
    - trivy

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Verify build
      run: ls -la dist
